    <meta name="theme-color" content="#FEBD00" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />

    <title>سراج - تعلّم الإسلام</title>

    <link rel="preload" href="/fonts/norsal.woff2" as="font" type="font/woff2" crossorigin />

    <style>
      /* Inlined boot paint: the brand splash shows before any JS parses. */
      html{color-scheme:light}
      html,body{margin:0;padding:0;background:#FEBD00;overscroll-behavior:none}
      #root{min-height:100dvh}
      #boot{position:fixed;inset:0;background:#FEBD00;z-index:9999;pointer-events:none;
        transition:opacity .4s ease-out}
    </style>
  </head>
  <body>
    <div id="boot"></div>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
